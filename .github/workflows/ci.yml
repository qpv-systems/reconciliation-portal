name: Portal CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  source:
    name: Source checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      published: ${{ steps.registry.outputs.published }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
      - run: npm run check
      - name: Validate manifest and sample catalog
        run: node -e "const fs=require('node:fs');for(const f of ['package.json','public/samples/catalog.json'])JSON.parse(fs.readFileSync(f,'utf8'))"
      - name: Check npm release availability
        id: registry
        shell: bash
        run: |
          node --input-type=module <<'JS'
          import { appendFileSync } from 'node:fs';
          const response = await fetch('https://registry.npmjs.org/@qpv-systems%2fcore-reconcile');
          if (response.status === 404) {
            appendFileSync(process.env.GITHUB_OUTPUT, 'published=false\n');
            appendFileSync(process.env.GITHUB_STEP_SUMMARY, 'Core Reconcile is not published to npm yet. Source checks ran; npm integration tests were **not run**. Re-run this workflow after publication.\n');
            console.log('::notice::Integration tests require the core npm release and have not run.');
          } else {
            if (!response.ok) throw new Error(`Registry returned HTTP ${response.status}`);
            const data = await response.json();
            if (!data.versions?.['0.1.0']) throw new Error('Required core version 0.1.0 is absent.');
            appendFileSync(process.env.GITHUB_OUTPUT, 'published=true\n');
          }
          JS
  integration:
    name: Integration (${{ matrix.os }}, Node ${{ matrix.node }})
    needs: source
    if: needs.source.outputs.published == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: ['22.18.0', '24']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ matrix.node }}
      - run: npm install --no-audit --no-fund
      - run: npm run format:check
      - run: npm test
      - name: Exercise bounded server staging
        if: matrix.os == 'ubuntu-latest' && matrix.node == '24'
        run: npm run test:memory
